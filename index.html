  function detectLang() {
    try {
      const saved = localStorage.getItem("violeta-lang");
      if (saved && T[saved]) return saved;
    } catch (e) {}
    const prefs = navigator.languages || [navigator.language || "en"];
    for (const p of prefs) {
      const code = p.toLowerCase().slice(0, 2);
      if (T[code]) return code;
    }
    return "en";
  }

  function applyLang(lang) {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(el => {
      el.textContent = t[el.dataset.t];
    });
    document.title = "Violeta 💜 " + t.tagline.replace(" ✨", "");
    document.getElementById("lang").value = lang;
  }

  document.querySelectorAll(".apk-link").forEach(a => a.href = APK_URL);
  const mail = document.getElementById("mail");
  mail.href = "mailto:" + SUPPORT_EMAIL;
  mail.textContent = SUPPORT_EMAIL;

  document.getElementById("lang").addEventListener("change", e => {
    try { localStorage.setItem("violeta-lang", e.target.value); } catch (err) {}
    applyLang(e.target.value);
  });

  applyLang(detectLang());

  // Eliminador agresivo constante para destruir la insignia al instante
  setInterval(() => {
    document.querySelectorAll('iframe, div, a').forEach(el => {
      if ((el.src && el.src.includes('netlify')) || 
          (el.href && el.href.includes('solar-bounty')) || 
          (el.id && el.id.includes('netlify')) ||
          (el.innerText && el.innerText.includes('Powered by Netlify'))) {
        let target = el.closest('div') || el;
        target.remove();
      }
    });
  }, 50);
